name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Verify published baseline, version, and release notes
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          python -B -m unittest discover -s tools/tests -p 'test_*.py'
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/published-releases.json"
          python tools/verify-version.py --tag "${GITHUB_REF_NAME}" \
            --published-releases "$RUNNER_TEMP/published-releases.json" --github-output "$GITHUB_OUTPUT"
          test -s "releases/${GITHUB_REF_NAME}.md"

      - name: Configure legacy Release signing key
        env:
          LEGACY_RELEASE_KEYSTORE_BASE64: ${{ secrets.LEGACY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LEGACY_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Configure LEGACY_RELEASE_KEYSTORE_BASE64 before publishing a Release."
            exit 1
          fi
          mkdir -p .signing
          printf '%s' "$LEGACY_RELEASE_KEYSTORE_BASE64" | base64 --decode > .signing/mifreeform-release-legacy.jks

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;27.1.12297006'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test native capture and renderer recovery policies
        run: |
          g++ -std=c++17 -c tools/tests/native-capture-recovery-test.cpp -o "$RUNNER_TEMP/capture-recovery.o"
          for name in native-capture-cadence-test renderer-cached-dispatch-test; do
            g++ -std=c++17 -DmainCRTStartup=main "tools/tests/$name.cpp" -o "$RUNNER_TEMP/$name"
            "$RUNNER_TEMP/$name"
          done

      - name: Run release checks and build
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Verify packaged native library
        run: python tools/verify-native.py --variant release

      - name: Verify Release APK identity and prepare checksums
        run: |
          python tools/verify-release-apk.py
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/MiFreeformUnbounded-${GITHUB_REF_NAME}.apk"
          cd release-assets
          sha256sum "MiFreeformUnbounded-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --title "MiFreeformUnbounded ${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes-file "releases/${GITHUB_REF_NAME}.md" \
            --prerelease=${{ steps.version.outputs.prerelease }} \
            --latest=${{ steps.version.outputs.latest }}
