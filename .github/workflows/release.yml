name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Configure legacy Release signing key
        env:
          LEGACY_RELEASE_KEYSTORE_BASE64: ${{ secrets.LEGACY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LEGACY_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Configure LEGACY_RELEASE_KEYSTORE_BASE64 before publishing a Release."
            exit 1
          fi
          mkdir -p .signing
          printf '%s' "$LEGACY_RELEASE_KEYSTORE_BASE64" | base64 --decode > .signing/mifreeform-release-legacy.jks

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release tag and version metadata
        run: python tools/verify-version.py --tag "${GITHUB_REF_NAME}"

      - name: Run release checks and build
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/app-release.apk \
            --title "MiFreeformUnbounded ${GITHUB_REF_NAME}" \
            --generate-notes
