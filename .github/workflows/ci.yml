name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Configure shared Debug signing key when provided
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "DEBUG_KEYSTORE_BASE64 is not configured; using the standard Android Debug keystore."
            exit 0
          fi
          mkdir -p .signing
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > .signing/mifreeform-debug.jks

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;27.1.12297006'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify version metadata
        run: python tools/verify-version.py

      - name: Test native capture and renderer recovery policies
        run: |
          g++ -std=c++17 -c tools/tests/native-capture-recovery-test.cpp -o "$RUNNER_TEMP/capture-recovery.o"
          for name in native-capture-cadence-test renderer-cached-dispatch-test; do
            g++ -std=c++17 -DmainCRTStartup=main "tools/tests/$name.cpp" -o "$RUNNER_TEMP/$name"
            "$RUNNER_TEMP/$name"
          done

      - name: Run unit tests, lint, and debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Verify packaged native library
        run: python tools/verify-native.py --variant debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MiFreeformUnbounded-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
